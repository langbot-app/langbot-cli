name: Build Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z, optionally with a prerelease or build suffix." >&2
            exit 1
          fi

      - name: Check and build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          make check
          make cross-build

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          release_dir="dist/release"
          mkdir -p "$release_dir"

          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            cp "dist/lbctl_${target}" "$release_dir/"
          done
          cp dist/lbctl_windows_amd64.exe "$release_dir/"
          cp dist/lbctl_windows_arm64.exe "$release_dir/"
          cp install.sh "$release_dir/"
          cp install.ps1 "$release_dir/"

          cd "$release_dir"
          sha256sum lbctl_* install.sh install.ps1 > checksums.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" ./dist/release/*
