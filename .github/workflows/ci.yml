name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go vet ./...
      - name: Verify wildcard and loopback port conflicts
        run: go test -v ./internal/deploy -run '^TestProbeNativePortRejectsListeningSockets$'
      - run: go test -race ./...
      - run: go build ./cmd/lbctl
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
  native-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LBCTL_NO_UPDATE_CHECK: '1'
      LANGBOT_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - if: runner.os != 'Windows'
        run: |
          go build -o "$RUNNER_TEMP/bin/lbctl" ./cmd/lbctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "LANGBOT_HOME=$RUNNER_TEMP/lang517-native" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP '中文 bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          go build -o "$bin/lbctl.exe" ./cmd/lbctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LANGBOT_HOME=$env:RUNNER_TEMP/lang517-native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: runner.os != 'Windows'
        run: sh scripts/test-native-e2e.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-native-e2e.ps1
      - if: failure() && runner.os != 'Windows'
        run: lbctl uninstall --yes --output json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/lang517-native/instances/*/logs/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: make check cross-build
      - uses: actions/upload-artifact@v4
        with:
          name: lbctl-binaries
          path: dist/
